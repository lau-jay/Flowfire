[tool.isort]
# isort formats the import sections
#
# isort v4
#
#     isort --jobs 8 --recursive ./flowfire
#
# isort v5 does not required option --recursive
#
#     isort --jobs 8 ./flowfire
#
# After, you may inverse "ASK, BID" ->  "BID, ASK" using:
#
#     find * -name '*.py' -exec sed 's/import ASK, BID/import BID, ASK/' -i {} +
#
known_first_party = "flowfire"
line_length = 130
py_version = 37
atomic = true
use_parentheses = true
balanced_wrapping = true
remove_redundant_aliases = true
color_output = true
skip_gitignore = true
lines_after_imports = 2
ensure_newline_before_comments = true

[tool.ruff]
line-length = 130
extend-exclude = ["tests", "docs", "build", "__init__.py"]
select = ["E", "W", "F"]
ignore = ["E501", "F405", "F403"]

[build-system]
requires = ["setuptools", "wheel", "Cython"]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "ruff>=0.16.3",
]
